    <script>
      // Early guard to prevent background Firebase installation errors from triggering fatal UI errors
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || reason.toString())) || '';
        if (msg.indexOf('installations/') !== -1 || msg.indexOf('API key not valid') !== -1 || msg.indexOf('FirebaseError') !== -1) {
          console.warn('[BBAN Analytics] Handled background service error gracefully:', msg);
          event.preventDefault();
        }
      });
    </script>
